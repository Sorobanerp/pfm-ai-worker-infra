name: pfm-ai-worker-ci-cd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-security-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run Ruff Lint
        run: ruff check src tests

      - name: Run Pytest Unit Suite
        run: pytest -v

      - name: Run Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Distroless Non-Root Image
        run: docker build -t ghcr.io/dantas-pfm/pfm-ai-worker-python:${{ github.sha }} .

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/dantas-pfm/pfm-ai-worker-python:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
